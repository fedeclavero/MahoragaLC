[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "Fede"
name = "MahoragaLC"
versionNumber = "1.0.0"
description = "Adds Eight-Handled Sword Divergent Sila Divine General Mahoraga as an adapting apex boss enemy for Lethal Company with dynamic proximity music."
websiteUrl = "https://github.com/fedeclavero/MahoragaLC"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
Evaisa-LethalLib = "1.2.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./Packages"

[[build.copy]]
source = "../bin/Release/netstandard2.1/Fede.MahoragaLC.dll"
target = "BepInEx/plugins/Fede-MahoragaLC/"

[[build.copy]]
source = "../../UnityProject/AssetBundles/StandaloneWindows64/mahoraga_assets"
target = "BepInEx/plugins/Fede-MahoragaLC/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
communities = [ "lethal-company", ]

[publish.categories]
lethal-company = [ "bepinex", "clientside", "serverside", "monsters", "mods", ]
