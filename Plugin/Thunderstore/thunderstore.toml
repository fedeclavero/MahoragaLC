[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "MahoragaTeam"
name = "MahoragaLC"
versionNumber = "1.1.1"
description = "Adds Mahoraga from Jujutsu Kaisen to Lethal Company. Fight an adapting boss with a turning Dharma Wheel, shadow ambushes, and Old Bird battles."
websiteUrl = "https://github.com/fedeclavero/MahoragaLC"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
Evaisa-LethalLib = "1.2.0"

[build]
icon = "./icon-mahoraga-lc.png"
readme = "./README.md"
outdir = "./Packages"

[[build.copy]]
source = "../bin/Release/netstandard2.1/Fede.MahoragaLC.dll"
target = "BepInEx/plugins/Fede-MahoragaLC/"

[[build.copy]]
source = "../../artifacts/thunderstore/mahoraga_assets"
target = "BepInEx/plugins/Fede-MahoragaLC/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
communities = [ "lethal-company", ]

[publish.categories]
lethal-company = [ "mods", "monsters", "bepinex", "clientside", "serverside", "ai-generated" ]
